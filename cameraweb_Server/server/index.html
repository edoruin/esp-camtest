<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a Cámara ZEMI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        #status {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #status.connected {
            color: #28a745;
        }
        #status.error {
            color: #dc3545;
        }
        .camera-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .camera-container.active {
            display: flex;
        }
        #cameraStream {
            width: 100%;
            max-width: 640px;
            border-radius: 8px;
            border: 2px solid #333;
        }
        #ipDisplay {
            font-weight: bold;
            color: #007bff;
        }
        #openStreamBtn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #openStreamBtn:hover {
            background-color: #0056b3;
        }
        #openStreamBtn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cámara ZEMI</h1>
        <p id="status">Conectando al broker MQTT...</p>
        <p>IP de cámara: <span id="ipDisplay">--</span></p>
    </div>
    
    <div class="container camera-container" id="cameraContainer">
        <img id="cameraStream" src="" alt="Stream de cámara">
        <button id="openStreamBtn" disabled>Abrir Stream en Nueva Pestaña</button>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
        const brokerUrl = 'wss://your-broker-url.hivemq.cloud:8884/mqtt';
        const topicIP = 'your/camera/topic';
        
        const statusEl = document.getElementById('status');
        const ipDisplayEl = document.getElementById('ipDisplay');
        const cameraContainer = document.getElementById('cameraContainer');
        const cameraStream = document.getElementById('cameraStream');
        const openStreamBtn = document.getElementById('openStreamBtn');
        let currentIp = null;
        let streamUrl = null;

        function updateStatus(message, type = 'normal') {
            statusEl.textContent = message;
            statusEl.className = type;
        }

        try {
            const client = mqtt.connect(brokerUrl, {
                clientId: 'web_client_' + Math.random().toString(16).substr(2, 8),
                clean: true,
                connectTimeout: 4000,
                reconnectPeriod: 1000,
                username: 'your_username',
                password: 'your_password'
            });

            client.on('connect', function() {
                updateStatus('Conectado al broker MQTT', 'connected');
                console.log('Conectado al broker MQTT');
                client.subscribe(topicIP, function(err) {
                    if (err) {
                        console.error('Error al suscribirse:', err);
                    } else {
                        console.log('Suscrito al topic:', topicIP);
                    }
                });
            });

            client.on('message', function(topic, message) {
                console.log('Mensaje recibido:', topic, message.toString());
                
                if (topic === topicIP) {
                    let ip = null;
                    try {
                        const data = JSON.parse(message.toString());
                        ip = data.ip;
                    } catch (e) {
                        console.warn('Mensaje no es JSON, intentando como string plano:', e);
                        ip = message.toString().trim();
                    }

                    if (ip) {
                        currentIp = ip;
                        streamUrl = 'http://' + ip;
                        ipDisplayEl.textContent = ip;
                        cameraStream.src = streamUrl;
                        cameraContainer.classList.add('active');
                        openStreamBtn.disabled = false;
                        updateStatus('Cámara conectada', 'connected');
                    } else {
                        console.error('No se pudo obtener la IP del mensaje:', message.toString());
                        updateStatus('Error: No se pudo obtener la IP de la cámara', 'error');
                    }
                }
            });

            client.on('error', function(err) {
                console.error('Error MQTT:', err);
                updateStatus('Error de conexión MQTT: ' + err.message, 'error');
            });

            client.on('offline', function() {
                updateStatus('Conexión MQTT perdida, reconectando...', 'error');
            });

            client.on('reconnect', function() {
                updateStatus('Reconectando al broker MQTT...', 'normal');
            });

        } catch (e) {
            console.error('Error al conectar:', e);
            updateStatus('Error al conectar: ' + e.message, 'error');
        }

        openStreamBtn.addEventListener('click', function() {
            if (streamUrl) {
                window.open(streamUrl, '_blank');
            } else {
                alert('Primero debes recibir la IP de la cámara del broker');
            }
        });
    </script>
</body>
</html>
